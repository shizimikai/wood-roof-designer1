<style>
  :root {

    --warn: #b45309; --warn-bg: #fff7e6; --err: #b91c1c; --err-bg: #fdecec; --info: #1d4ed8; --info-bg: #eef3ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", system-ui, sans-serif; font-size: 14px; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
  header span { color: var(--muted); font-size: 12px; }

  aside { align-self: start; background: var(--panel); border-right: 1px solid var(--line); padding: 8px 16px 40px; overflow-y: auto; max-height: calc(100vh - 52px); position: sticky; top: 0; }
  fieldset { border: none; padding: 0; margin: 14px 0 6px; }
  legend { font-weight: 700; font-size: 12px; color: var(--accent); letter-spacing: .08em; padding: 0; margin-bottom: 6px; }
  .f { display: grid; grid-template-columns: 1fr 92px; align-items: center; gap: 6px; padding: 4px 0; }
  .f label { font-size: 13px; }
  .f .hint { grid-column: 1 / -1; color: var(--muted); font-size: 11px; margin-top: -2px; line-height: 1.5; }
  .f input[type=number], .f select { width: 100%; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: #fff; text-align: right; }
  .f select { text-align: left; }
  .f .unit { position: relative; }

  .f.check { grid-template-columns: 1fr auto; }
  .f input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  details { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 10px; }
  summary { cursor: pointer; font-weight: 700; font-size: 12px; color: var(--steel); }
  section#right { display: flex; flex-direction: column; min-width: 0; }

  .vtools button, .btn { border: 1px solid var(--line); background: rgba(255,255,255,.92); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 12px; cursor: pointer; color: var(--ink); }
  .vtools button[aria-pressed=true] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .legend3d { position: absolute; bottom: 10px; left: 10px; display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--steel); background: rgba(255,255,255,.85); padding: 5px 10px; border-radius: 8px; }
  .legend3d i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .dimlabel { font-size: 11px; background: rgba(31,35,40,.82); color: #fff; padding: 2px 6px; border-radius: 4px; white-space: nowrap; pointer-events: none; }
  #results { padding: 18px 22px 60px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .card .k { font-size: 11px; color: var(--muted); }
  .card .v { font-size: 22px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .card .s { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .card.total { background: var(--accent-soft); border-color: #e9cfae; }
  .card.total .v { color: var(--accent); }
  .warns { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 6px; }
  .warns li { padding: 8px 12px; border-radius: 8px; font-size: 12.5px; line-height: 1.6; }

  .warns .info { background: var(--info-bg); color: var(--info); }
  h2 { font-size: 14px; margin: 26px 0 8px; display: flex; align-items: center; gap: 10px; }
  h2 .sub { font-weight: 400; color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-variant-numeric: tabular-nums; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; font-size: 13px; }
  th { background: #faf9f7; font-size: 11px; color: var(--muted); font-weight: 600; }
  td.n, th.n { text-align: right; }
  tr.grp td { background: #faf9f7; font-size: 11px; font-weight: 700; color: var(--steel); }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover, tbody tr.sel { background: var(--accent-soft); }
  tfoot td { font-weight: 700; }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .foot { color: var(--muted); font-size: 11px; margin-top: 22px; line-height: 1.7; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .tabs { display: flex; gap: 4px; margin: 22px 0 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tabs button { border: 1px solid transparent; border-bottom: none; background: none; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer; color: var(--muted); border-radius: 8px 8px 0 0; margin-bottom: -1px; }
  .tabs button[aria-selected=true] { background: var(--panel); border-color: var(--line); color: var(--ink); font-weight: 700; }
  .pane { display: none; }
  .pane.on { display: block; }
  .pane h2:first-child { margin-top: 16px; }
  .sheet { background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: auto; }
  .sheet svg { display: block; width: 100%; height: auto; min-width: 640px; }
  .saverow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .saverow label { font-size: 13px; }
  .saverow input { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; min-width: 200px; }
  .scrollx { overflow-x: auto; }
  table.cmp td, table.cmp th { white-space: nowrap; }
  table.cmp tr.currow td { background: #faf9f7; }
  table.cmp td.best { color: #15803d; font-weight: 700; }
  .subname { font-size: 11px; color: var(--muted); }
  .tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); vertical-align: 1px; }
  .tag.open { background: var(--info-bg); color: var(--info); }
  .wcount { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); font-size: 11px; text-align: center; }
  .ops { display: flex; gap: 4px; }
  .mini { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 3px 8px; font: inherit; font-size: 11px; cursor: pointer; }
  .mini.danger { color: var(--err); }
  .btn:disabled { opacity: .45; cursor: default; }
  .empty { color: var(--muted); font-size: 12.5px; }
  .lw { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .f.wide { grid-template-columns: 1fr; }
  .f.wide select { text-align: left; }
  .f.sel { grid-template-columns: 1fr 132px; }
  .q { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; padding: 0; margin-left: 3px; border-radius: 50%; border: 1px solid #c9c4bb; background: #fff; color: var(--muted); font: 700 10px/1 system-ui, sans-serif; cursor: help; flex: none; vertical-align: 1px; }
  .q:hover, .q:focus-visible { background: var(--ink); color: #fff; border-color: var(--ink); outline: none; }
  .term { white-space: nowrap; }
  #tip { position: fixed; z-index: 50; max-width: 300px; background: #1f2328; color: #fff; padding: 10px 12px; border-radius: 10px; font-size: 12.5px; line-height: 1.65; box-shadow: 0 6px 24px rgba(0,0,0,.18); opacity: 0; pointer-events: none; transition: opacity .12s; }
  #tip.on { opacity: 1; pointer-events: auto; }
  #tip b { display: block; font-size: 13px; margin-bottom: 2px; }
  #tip p { margin: 0; }
  #tip .tiphint { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.2); color: #ffd9b8; }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
    aside { position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--line); order: 2; }
    section#right { order: 1; }
    #viewer { height: 46vh; }
    header span, .legend3d { display: none; }
  }
  @media print {
    aside, .vtools, .actions, header span, .tabs, .ops { display: none; }
    .pane { display: block; }
    main { display: block; }
    #viewer { height: 360px; }
  }

  .cut { margin: 0 0 6px; }
  .cut td { vertical-align: top; }
  .cutbar { display: flex; height: 16px; border-radius: 4px; overflow: hidden; background: repeating-linear-gradient(45deg, #eee, #eee 4px, #f8f8f8 4px, #f8f8f8 8px); border: 1px solid var(--line); min-width: 220px; }
  .cutbar span { background: #e6c79c; border-right: 2px solid #fff; font-size: 9.5px; line-height: 16px; color: #5b3a17; overflow: hidden; white-space: nowrap; padding-left: 3px; }
  .cutlist { font-size: 12px; color: var(--steel); margin-top: 3px; }
</style>

<body>
<header>
  <h1>木の屋根 設計ツール（2x4材）</h1>
  <span>寸法を入れると、骨組みの3D・部材の本数・木取り・購入リスト・概算費用が出ます</span>
</header>
<main>
  <aside id="panel"></aside>
  <section id="right">
    <div id="viewer">
      <div class="vtools">
        <button data-view="persp">斜めから</button>
        <button data-view="front">正面</button>
        <button data-view="side">側面</button>
        <button data-view="top">真上</button>
        <button id="tRoof" aria-pressed="true">屋根</button>
        <button id="tWall" aria-pressed="true">壁</button>
        <button id="tDims" aria-pressed="true">寸法</button>
      </div>
      <div class="legend3d" id="legend3d"></div>
    </div>
    <div id="results"></div>
  </section>
</main>
<div id="toast"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { compute, DEFAULTS, SIZES, SIZE_ORDER, FT, SHEETS, lumberKey, sheetKey, memberFrame, FACE_KEYS } from './wood-core.js';
import { drawSheet } from './drawing.js';
import { GLOSSARY } from './glossary.js';

// ---------- 入力項目 ----------
// term: 「？」で出す用語（glossary.js）。hint: その入力欄だけの補足（「？」の中に一緒に出す）
const isMono = (p) => p.roofType === 'mono';
const isBrace = (k) => (p) => p['b' + k] === 'brace' || p['b' + k] === 'x';
const anyWall = (p) => FACE_KEYS.some((k) => p['w' + k] !== 'none');
const anyKoshi = (p) => FACE_KEYS.some((k) => p['w' + k] === 'koshi');
const anyKnee = (p) => FACE_KEYS.some((k) => p['b' + k] === 'knee');
const WALL_OPTIONS = [['none', 'なし'], ['full', '上まで'], ['koshi', '腰壁（下だけ）']];
const BRACE_OPTIONS = [['none', 'なし'], ['knee', '方杖'], ['brace', '筋交い（1本）'], ['x', 'たすき（X字）']];
const FACE_FIELDS = [['F', '前面'], ['B', '後面'], ['R', '左面'], ['L', '右面']].flatMap(([k, g]) => [
  { g, id: 'w' + k, label: '壁', type: 'select', options: WALL_OPTIONS, term: '壁', hint: k === 'F' ? '出入りする面は、壁なしか腰壁にすることが多いです。' : '' },
  { g, id: 'b' + k, label: '補強', type: 'select', options: BRACE_OPTIONS, term: (p) => (p['b' + k] === 'knee' ? '方杖' : p['b' + k] === 'x' ? 'たすき' : '筋交い'), hint: k === 'F' ? '出入りする面は、方杖にするとじゃまになりにくいです。' : '' },
  { g, id: `b${k}lo`, label: '筋交いの下端', unit: 'm', step: 0.1, min: 0.05, max: 5, show: isBrace(k), term: '筋交い', hint: '筋交いが始まる高さです。' },
  { g, id: `b${k}hi`, label: '筋交いの上端', unit: 'm', step: 0.1, min: 0, max: 6, show: isBrace(k), term: '筋交い', hint: '0 のときは桁・垂木のすぐ下までになります。' },
  { g, id: 't' + k, label: '胴つなぎの高さ', unit: 'm', step: 0.1, min: 0, max: 5, show: (p) => p['w' + k] !== 'full', term: '胴つなぎ', hint: '0 のときは入れません。' },
]);
const BASE_OPTIONS = [['slab', 'コンクリートの土間に固定'], ['pincoro', '羽子板付き束石に載せる'], ['footing', '穴を掘ってコンクリート'], ['spike', '打ち込み式ポストベース']];
const priceGroup = '単価（円・税込）';
const FIELDS = [
  { g: '基本寸法', id: 'W', label: '間口（幅）', unit: 'm', step: 0.1, min: 1, max: 12, term: '間口' },
  { g: '基本寸法', id: 'D', label: '奥行き', unit: 'm', step: 0.1, min: 1, max: 8, term: '奥行き' },
  { g: '基本寸法', id: 'roofType', label: '屋根の形', type: 'select', options: [['mono', '片流れ'], ['gable', '切妻（三角）']], term: '屋根の形' },
  { g: '基本寸法', id: 'H1', label: (p) => (isMono(p) ? '前の高さ' : '軒の高さ'), unit: 'm', step: 0.1, min: 1.5, max: 3.6, term: (p) => (isMono(p) ? '前の高さ' : '軒') },
  { g: '基本寸法', id: 'H2', label: '後ろの高さ', unit: 'm', step: 0.1, min: 1.5, max: 3.6, show: isMono, term: '後ろの高さ' },
  { g: '基本寸法', id: 'Hr', label: '棟の高さ', unit: 'm', step: 0.1, min: 1.5, max: 5, show: (p) => !isMono(p), term: '棟' },
  { g: '基礎', id: 'base', label: '基礎の種類', type: 'select', wide: true, options: BASE_OPTIONS, term: '基礎の種類' },
  { g: '基礎', id: 'embed', label: '基礎の深さ', unit: 'm', step: 0.05, min: 0.1, max: 1.2, show: (p) => p.base === 'footing', term: '基礎の深さ', hint: '45cm以上が目安です。' },
  { g: '基礎', id: 'holeD', label: '穴の直径', unit: 'm', step: 0.05, min: 0.15, max: 0.6, show: (p) => p.base === 'footing', term: '穴の直径' },
  { g: '柱と桁', id: 'nx', label: '間口方向の柱の本数', unit: '本', step: 1, min: 2, max: 8, term: '柱', hint: '前の列と後ろの列、それぞれの本数です。柱は4x4材です。' },
  { g: '柱と桁', id: 'ny', label: '奥行き方向の柱の本数', unit: '本', step: 1, min: 2, max: 6, term: '柱', hint: '左右の列の本数です（角の柱も含みます）。' },
  { g: '柱と桁', id: 'beamSize', label: '桁の太さ', type: 'select', options: [['2x6', '2x6'], ['2x8', '2x8'], ['2x10', '2x10']], term: '桁' },
  { g: '柱と桁', id: 'beamPly', label: '桁の枚数', type: 'select', options: [['2', '2枚（柱を挟む）'], ['1', '1枚（外側だけ）']], term: '桁' },
  { g: '屋根', id: 'rafterSize', label: '垂木の太さ', type: 'select', options: [['2x4', '2x4'], ['2x6', '2x6'], ['2x8', '2x8']], term: '垂木', hint: '切妻の棟木は、垂木より1つ太いものを使います。' },
  { g: '屋根', id: 'rs', label: '垂木の間隔', unit: 'm', step: 0.05, min: 0.3, max: 1.2, term: '垂木', hint: '45〜60cmが目安です。この間隔以下になるように本数を決めます。' },
  { g: '屋根', id: 'oe', label: '軒の出（前後）', unit: 'm', step: 0.05, min: 0, max: 1, term: '軒の出' },
  { g: '屋根', id: 'os', label: 'けらばの出（左右）', unit: 'm', step: 0.05, min: 0, max: 0.6, term: 'けらばの出' },
  { g: '屋根', id: 'ps', label: '母屋の間隔', unit: 'm', step: 0.05, min: 0.3, max: 1.2, term: '母屋（横桟）', hint: '60〜90cmが目安です。' },
  { g: '屋根', id: 'roofing', label: '波板を張る', type: 'check', term: '波板' },
  ...FACE_FIELDS,
  { g: '壁と補強の共通設定', id: 'wMat', label: '壁の材料', type: 'select', options: [['ply', '構造用合板'], ['sheet', '波板'], ['board', '杉板（縦張り）']], show: anyWall, term: '壁の材料' },
  { g: '壁と補強の共通設定', id: 'wH', label: '腰壁の高さ', unit: 'm', step: 0.1, min: 0.3, max: 2, show: anyKoshi, term: '腰壁' },
  { g: '壁と補強の共通設定', id: 'studPitch', label: '間柱の間隔', unit: 'm', step: 0.05, min: 0.3, max: 0.91, show: (p) => anyWall(p) && p.wMat === 'ply', term: '間柱', hint: '45.5cmが標準です。' },
  { g: '壁と補強の共通設定', id: 'railPitch', label: '胴縁の間隔', unit: 'm', step: 0.05, min: 0.3, max: 0.91, show: (p) => anyWall(p) && p.wMat !== 'ply', term: '胴縁', hint: '45〜60cmが目安です。' },
  { g: '壁と補強の共通設定', id: 'kneeL', label: '方杖の長さ', unit: 'm', step: 0.05, min: 0.3, max: 1.2, show: anyKnee, term: '方杖', hint: '柱や桁に沿って測った長さです。45〜90cmが目安です。' },
  { g: '木材と塗装', id: 'treated', label: '防腐処理材を使う', type: 'check', term: '防腐処理材', hint: '入れると、木材の単価に「防腐処理材の倍率」を掛けます。' },
  { g: '木材と塗装', id: 'paint', label: '塗装する', type: 'check', term: '木材保護塗料' },
  { g: '木材と塗装', id: 'coats', label: '塗る回数', unit: '回', step: 1, min: 1, max: 3, show: (p) => p.paint === true || p.paint === 'true', term: '木材保護塗料' },
  { g: '細かい設定', adv: true, id: 'margin', label: '切りしろ', unit: 'm', step: 0.005, min: 0, max: 0.1, term: '切りしろ', hint: '部材1本ごとにこの長さを足して、定尺に割り付けます。' },
  { g: '細かい設定', adv: true, id: 'anchorsPerBase', label: '金物1個のアンカー本数', unit: '本', step: 1, min: 1, max: 4, show: (p) => p.base === 'slab', term: 'あと施工アンカー' },
  { g: '細かい設定', adv: true, id: 'sheetWork', label: '波板1枚の働き幅', unit: 'm', step: 0.01, min: 0.3, max: 1, term: '働き幅' },

function showTip(btn) {
  const term = btn.dataset.term, hint = btn.dataset.hint;
  const body = term && GLOSSARY[term] ? GLOSSARY[term] : '';
  tip.innerHTML = (term ? `<b>${escT(term)}</b>` : '') + (body ? `<p>${escT(body).replace(/\n/g, '<br>')}</p>` : '') + (hint ? `<p class="tiphint">${escT(hint)}</p>` : '');

function normalizeParams(obj) {
  const out = { ...DEFAULTS };
  if (!obj || typeof obj !== 'object') return out;
  for (const k in DEFAULTS) {
    if (!(k in obj)) continue;
    const v = obj[k], d = DEFAULTS[k];
    if (typeof d === 'number') { const n = Number(v); if (Number.isFinite(n)) out[k] = n; }
    else if (typeof d === 'boolean') out[k] = v === true || v === 'true' || v === 1;
    else if (typeof v === 'string') out[k] = v;
  }
  for (const k in ENUMS) if (!ENUMS[k].includes(out[k])) out[k] = DEFAULTS[k];
  out.beamPly = out.beamPly >= 2 ? 2 : 1;
  return out;
}

function build(r) {

  } else {

let currentView = 'persp', lastDimsObj = null;

const fmtDate = (iso) => { try { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; } catch { return ''; } };
const safeFile = (s) => String(s || '木の屋根').replace(/[\\/:*?"<>|]/g, '_').slice(0, 60);
let last = null;

// ---------- 保存（このブラウザの中） ----------
const SAVE_KEY = LS + '-saves', META_KEY = LS + '-meta';
let saves = [];
try { const a = JSON.parse(localStorage.getItem(SAVE_KEY) || '[]'); if (Array.isArray(a)) saves = a.map((d) => ({ ...d, params: normalizeParams(d.params) })); } catch (e) { /* 無視 */ }
let meta = { name: '', saveId: null };
try { Object.assign(meta, JSON.parse(localStorage.getItem(META_KEY) || '{}')); } catch (e) { /* 無視 */ }
const sameParams = (a, b) => Object.keys(DEFAULTS).every((k) => String(a[k]) === String(b[k]));
try {
  const lastLocal = localStorage.getItem(LS);
  if (location.hash.length > 1 && (!lastLocal || !sameParams(normalizeParams(JSON.parse(lastLocal)), state))) meta = { name: '', saveId: null };
} catch (e) { /* 無視 */ }
function storeSaves() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(saves)); return true; }
  catch (e) { toast('ブラウザに保存できませんでした。JSONで書き出しておいてください'); return false; }
}
function storeMeta() { try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (e) { /* 無視 */ } }
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function nextName() { let n = saves.length + 1; while (saves.some((s) => s.name === `設計${n}`)) n++; return `設計${n}`; }

function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const exportJson = (designs) => JSON.stringify({ app: 'wood-roof-designer', version: 1, exportedAt: new Date().toISOString(), designs }, null, 2);

function importJson(text, fileName) {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { toast('JSONとして読めませんでした'); return; }
  const base = String(fileName || '読み込んだ設計').replace(/\.json$/i, '');
  let list;
  if (obj && Array.isArray(obj.designs)) list = obj.designs;
  else if (Array.isArray(obj)) list = obj;
  else if (obj && obj.params) list = [obj];
  else if (obj && typeof obj === 'object' && ('W' in obj || 'D' in obj)) list = [{ name: base, params: obj }];
  else { toast('このツールの設計データではないようです'); return; }
  const added = [];
  list.forEach((d, i) => {
    if (!d || typeof d !== 'object') return;
    const params = normalizeParams(d.params || d);
    const name = String(d.name || (list.length > 1 ? `${base} ${i + 1}` : base)).slice(0, 60);
    const dup = saves.find((s) => s.name === name && sameParams(s.params, params));
    if (dup) { added.push(dup); return; }
    const rec = { id: newId(), name, savedAt: d.savedAt || new Date().toISOString(), params };
    saves.push(rec); added.push(rec);
  });
  if (!added.length) { toast('読み込める設計がありませんでした'); return; }
  storeSaves();
  if (added.length === 1) { openSave(added[0]); toast(`「${added[0].name}」を読み込みました`); }
  else { activeTab = 'saves'; renderResults(last); toast(`${added.length}件の設計を読み込みました`); }
}
function openSave(rec) {
  state = normalizeParams(rec.params);
  meta = { name: rec.name, saveId: rec.id }; storeMeta();
  buildForm(); update(true);
}

function sheetSvg(r) { return drawSheet(r, { name: meta.name || '木の屋根（2x4材）', date: todayJa() }); }
const PAPER = { A3: { w: 420, h: 297 }, A4: { w: 297, h: 210 } };
function printSheet(r, paper = 'A3') {
  const P = PAPER[paper], m = 8, ratio = 1188 / 840;
  const availW = P.w - 2 * m - 2, availH = P.h - 2 * m - 2;
  const w = Math.min(availW, availH * ratio), h = w / ratio;
  const win = window.open('', '_blank');
  if (!win) { toast('ポップアップがブロックされました。SVGで保存して印刷してください'); return; }
  win.document.write(`<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>${esc(meta.name || '3面図')}</title>
    <style>@page{size:${paper} landscape;margin:${m}mm}html,body{margin:0;padding:0}
    .page{width:${w.toFixed(1)}mm;height:${h.toFixed(1)}mm;margin:0 auto;overflow:hidden;page-break-inside:avoid;break-inside:avoid}
    .page svg{display:block;width:100%;height:100%}</style></head>
    <body><div class="page">${sheetSvg(r).replace(/ width="1188" height="840"/, '')}</div><script>setTimeout(function(){print()},300)<\/script></body></html>`);
  win.document.close();
}

// 木取り表：同じ切り方の定尺はまとめる
function cutTable(r) {
  const out = [];
  for (const size of SIZE_ORDER) {
    const boards = r.boards[size]; if (!boards) continue;
    const pat = new Map();
    for (const b of boards) {
      const key = b.ft + '|' + b.cuts.map((c) => c.name + ':' + c.len.toFixed(3)).join(',');
      if (!pat.has(key)) pat.set(key, { b, n: 0 });
      pat.get(key).n++;
    }
    const rows = [...pat.values()].sort((a, b) => b.b.ft - a.b.ft).map(({ b, n }) => {
      const bar = b.cuts.map((c) => `<span style="width:${(c.need / b.len) * 100}%" title="${esc(c.name)} ${mmTxt(c.len)}mm">${esc(c.name)}</span>`).join('');
      const list = b.cuts.map((c) => `${esc(c.name)} ${mmTxt(c.len)}`).join(' ＋ ');
      return `<tr><td>${b.ft}フィート<div class="subname">${mmTxt(b.len)}mm</div></td><td class="n">${n}本</td><td><div class="cutbar">${bar}</div><div class="cutlist">${list}　<span style="color:var(--muted)">（残り ${mmTxt(b.rem)}mm）</span></div></td></tr>`;
    }).join('');
    const used = boards.reduce((a, b) => a + b.len - b.rem, 0), all = boards.reduce((a, b) => a + b.len, 0);
    out.push(`<h2>${size}材 <span class="sub">${boards.length}本・使う割合 ${Math.round((used / all) * 100)}%</span></h2>
      <table class="cut"><thead><tr><th>定尺</th><th class="n">本数</th><th>切り方（mm）</th></tr></thead><tbody>${rows}</tbody></table>`);
  }
  return out.join('');
}

  // 比較表

  const FN = { F: '前', B: '後', R: '左', L: '右' };
  const summarize = (p, rr) => {
    const d = rr.dims; const H = Math.max(d.H1, d.H2, d.mono ? 0 : d.Hr);
    const braces = ['F', 'B', 'R', 'L'].filter((k) => p['b' + k] !== 'none').map((k) => FN[k] + ({ knee: '方', brace: '筋', x: 'X' })[p['b' + k]]).join(' ');
    const walls = rr.walls.length ? rr.walls.map((w) => FN[w.face] + (w.kind === 'koshi' ? '腰' : '')).join(' ') + `（${WALL_NAME[rr.walls[0].mat]}）` : 'なし';
    return {
      shape: d.mono ? '片流れ' : '切妻', size: `${d.W}×${d.D}×${H}m`, cols: `柱${rr.postCount}／垂木${rr.nr}`,
      base: ({ slab: '土間', pincoro: '束石', footing: 'コンクリート', spike: '打ち込み' })[d.base] || '土間', braces: braces || 'なし', walls, lumber: `${rr.lumberCount}本`, weight: `${Math.round(rr.weight)}kg`, total: rr.total,
      warns: rr.warnings.filter((w) => w.level !== 'info').length,
    };
  };
  const rowsData = [{ cur: true, name: meta.name || '（名前なし）', s: summarize(state, r) },
    ...saves.map((sv) => ({ sv, name: sv.name, s: summarize(sv.params, compute(sv.params)) }))];
  const minTotal = Math.min(...rowsData.map((x) => x.s.total));
  const cmpRows = rowsData.map((x) => {
    const diff = x.s.total - r.total;
    const diffTxt = x.cur ? '—' : diff === 0 ? '±0' : (diff > 0 ? '+' : '−') + yen(Math.abs(diff)).slice(1);
    const isOpen = x.sv && x.sv.id === meta.saveId;
    const nameCell = x.cur
      ? `<b>いま編集中</b><div class="subname"><span>${esc(x.name)}</span>${dirty ? ' <span class="tag">変更あり</span>' : ''}</div>`
      : `${esc(x.name)}${isOpen ? ' <span class="tag open">編集中</span>' : ''}<div class="subname">${fmtDate(x.sv.savedAt)}</div>`;
    const ops = x.cur ? '' : `<button class="mini" data-op="open" data-id="${x.sv.id}">開く</button><button class="mini" data-op="over" data-id="${x.sv.id}">上書き</button><button class="mini" data-op="json" data-id="${x.sv.id}">JSON</button><button class="mini danger" data-op="del" data-id="${x.sv.id}">削除</button>`;
    return `<tr class="${x.cur ? 'currow' : ''}"><td>${nameCell}</td><td>${x.s.shape}</td><td>${x.s.size}</td><td>${x.s.cols}</td><td>${x.s.base}</td><td>${x.s.walls}</td><td>${x.s.braces}</td><td class="n">${x.s.lumber}</td><td class="n">${x.s.weight}</td>
      <td class="n${x.s.total === minTotal && rowsData.length > 1 ? ' best' : ''}">${yen(x.s.total)}</td><td class="n">${diffTxt}</td><td class="n">${x.s.warns ? `<span class="wcount">${x.s.warns}</span>` : '—'}</td><td class="ops">${ops}</td></tr>`;
  }).join('');

  const tabs = [['buy', '購入リスト'], ['parts', '部材リスト'], ['cut', '木取り表'], ['draw', '3面図'], ['saves', `保存・比較${saves.length ? `（${saves.length}）` : ''}`]];
  const wallArea = r.walls.reduce((a, w) => a + w.area, 0);
  el.innerHTML = `
    <div class="cards">
      <div class="card total"><div class="k">概算の材料費</div><div class="v">${yen(r.total)}</div><div class="s">税込・ホームセンター価格の目安</div></div>

      <div class="card"><div class="k">${r.walls.length ? '壁の面積' : '木材の重さ'}</div><div class="v">${r.walls.length ? wallArea.toFixed(1) + '㎡' : '約' + Math.round(r.weight) + 'kg'}</div><div class="s">${r.walls.length ? `${r.walls.length}面・${WALL_NAME[r.walls[0].mat]}／木材 約${Math.round(r.weight)}kg` : 'SPF（約450kg/㎥）の場合'}</div></div>
    </div>
    <ul class="warns">${warns.map((w) => `<li class="${w.level}">${withTerms(esc(w.text))}</li>`).join('')}</ul>
    <div class="tabs" role="tablist">${tabs.map(([k, t]) => `<button role="tab" data-tab="${k}" aria-selected="${k === activeTab}">${t}</button>`).join('')}</div>

      <tbody>${itemRows}</tbody>
      <tfoot><tr><td colspan="4">合計</td><td class="n">${yen(r.total)}</td></tr></tfoot></table>
      <div class="actions"><button class="btn" id="bCsv">購入リストをCSVで保存</button></div>
      <p class="foot">・木材の本数は、「木取り表」のように部材を定尺に割り付けて数えています。<br>・ビスの本数は目安です。箱で買うので、少し余ります。</p>
    </div>

      ${cutTable(r)}

    <div class="pane" data-pane="saves">

      rec.params = { ...state }; rec.savedAt = new Date().toISOString(); meta.saveId = rec.id; meta.name = rec.name; storeMeta();

  };
}

function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.style.opacity = 1; setTimeout(() => (el.style.opacity = 0), 1600); }

function update(resetView) {
  refreshFormVisibility();
  if (resetView) lastDims = null;
  const r = compute(state); last = r;
  build(r); renderResults(r);
  const d = diffState();
  try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) { /* 無視 */ }
  history.replaceState(null, '', Object.keys(d).length ? '#' + encodeURIComponent(JSON.stringify(d)) : location.pathname + location.search);
}

buildForm();
resize();
update();
</script>
